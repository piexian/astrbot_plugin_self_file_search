name: astrbot_plugin_self_file_search
display_name: 白名单搜索
desc: 给 LLM 提供白名单目录内的代码搜索与读取工具（self_search/self_read/self_glob + LSP 语义 self_symbols/self_refs/self_def）。数据源由管理员登记，支持多源与版本戳；只读、输出限长，供非管理员群聊安全使用。
short_desc: 让机器人直接查白名单内的代码与文件，替代把源码嵌进向量库
version: 1.0.3
author: piexian
repo: https://github.com/piexian/astrbot_plugin_self_file_search
astrbot_version: ">=4.10.4"
